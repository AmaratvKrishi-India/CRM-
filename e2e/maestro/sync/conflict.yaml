# Sync Conflict Resolution Flow
# Exercises the supported offline edit/reconnect path and verifies the local record survives recovery.
# A second remote writer is outside a single-device Maestro flow; conflict semantics are covered by the sync tests.

appId: "com.amaratvkrishi.salescrm"

---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 120000
- tapOn:
    id: "login-email"
- inputText: ${MAESTRO_AGENT_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_AGENT_PASSWORD}
- tapOn: "Sign In"

- extendedWaitUntil:
    visible:
      id: "app-main-content"
    timeout: 60000
- tapOn:
    id: "app-tab-LEADS"
- tapOn: "Add Lead"
- extendedWaitUntil:
    visible:
      id: "create-business-name"
    timeout: 30000
- tapOn:
    id: "create-business-name"
- inputText: "Legacy Maestro Conflict ${MAESTRO_RUN_TAG} Gym"
- tapOn:
    id: "create-phone"
- inputText: "9${MAESTRO_RUN_TAG}023"
- tapOn:
    id: "create-locality"
- inputText: "Gomti Nagar"
- hideKeyboard
- tapOn:
    id: "save-create-lead-button"
- assertNotVisible:
    id: "create-lead-form"
- extendedWaitUntil:
    visible: ".*Legacy Maestro Conflict ${MAESTRO_RUN_TAG} Gym.*"
    timeout: 60000
- tapOn: ".*Legacy Maestro Conflict ${MAESTRO_RUN_TAG} Gym.*"
- extendedWaitUntil:
    visible:
      id: "lead-detail"
    timeout: 60000

- setAirplaneMode: enabled
- tapOn:
    id: "back-button"
- tapOn:
    id: "app-tab-DASHBOARD"
- tapOn:
    id: "app-tab-LEADS"
- tapOn:
    id: "leads-search"
- inputText: "Legacy Maestro Conflict ${MAESTRO_RUN_TAG} Gym"
- hideKeyboard
- tapOn:
    text: ".*Legacy Maestro Conflict ${MAESTRO_RUN_TAG} Gym.*"
- extendedWaitUntil:
    visible:
      id: "lead-detail"
    timeout: 60000
- tapOn:
    id: "edit-lead-button"
- extendedWaitUntil:
    visible:
      id: "edit-business-name"
    timeout: 30000
- tapOn:
    id: "edit-business-name"
- eraseText: 100
- inputText: "Legacy Maestro Conflict ${MAESTRO_RUN_TAG} Gym LOCAL"
- hideKeyboard
- tapOn:
    id: "save-edit-lead-button"
- assertNotVisible:
    id: "edit-lead-form"
- extendedWaitUntil:
    visible: ".*Legacy Maestro Conflict ${MAESTRO_RUN_TAG} Gym LOCAL.*"
    timeout: 60000

- tapOn:
    id: "back-button"
- tapOn:
    id: "app-tab-DASHBOARD"
- setAirplaneMode: disabled
- launchApp:
    clearState: false
- tapOn: "Sync Now"
- extendedWaitUntil:
    visible: "Synced"
    timeout: 120000
- tapOn:
    id: "app-tab-LEADS"
- tapOn:
    id: "leads-search"
- inputText: "Legacy Maestro Conflict ${MAESTRO_RUN_TAG} Gym LOCAL"
- hideKeyboard
- tapOn:
    text: ".*Legacy Maestro Conflict ${MAESTRO_RUN_TAG} Gym LOCAL.*"
- assertVisible: ".*Legacy Maestro Conflict ${MAESTRO_RUN_TAG} Gym LOCAL.*"
- assertVisible:
    id: "lead-detail"
