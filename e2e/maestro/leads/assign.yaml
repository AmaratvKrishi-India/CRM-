# Assign Lead Flow - Admin Assigns Lead to Agent
# Selects an unassigned seeded lead and completes the current bulk assignment modal.

appId: "com.amaratvkrishi.salescrm"

---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 120000
- tapOn:
    id: "login-email"
- inputText: ${MAESTRO_ADMIN_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_ADMIN_PASSWORD}
- tapOn: "Sign In"

- extendedWaitUntil:
    visible:
      id: "admin-main-content"
    timeout: 60000
- tapOn:
    id: "admin-tab-leads"
- tapOn:
    id: "admin-leads-search"
- inputText: "Iron Paradise Alambagh"
- hideKeyboard
- extendedWaitUntil:
    visible:
      text: ".*Iron Paradise Alambagh.*"
    timeout: 60000
- tapOn:
    text: "Assign Iron Paradise Alambagh"
    optional: true
- tapOn:
    text: "Reassign Iron Paradise Alambagh"
    optional: true
- tapOn:
    text: "Assign"
    optional: true
- extendedWaitUntil:
    visible: "Assign / Reassign Lead"
    timeout: 30000
- tapOn:
    text: "Unassign"
    optional: true
- tapOn:
    text: "Assign Iron Paradise Alambagh"
    optional: true
- tapOn:
    text: "Reassign Iron Paradise Alambagh"
    optional: true
- extendedWaitUntil:
    visible: "Assign / Reassign Lead"
    timeout: 30000
- tapOn: ".*Rahul Verma.*"
- tapOn:
    text: ".*Assign Lead.*"
    optional: true
- tapOn:
    text: ".*Reassign Lead.*"
    optional: true
- extendedWaitUntil:
    visible: ".*Iron Paradise Alambagh.*"
    timeout: 60000
- assertVisible: "Assigned:.*"
- assertVisible: "Rahul Verma"
