# Online Sync Flow - Agent Syncs When Online
# Creates local work, invokes the current sync action, and verifies SYNCED state.

appId: "com.amaratvkrishi.salescrm"

---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 120000
- tapOn:
    id: "login-email"
- inputText: ${MAESTRO_AGENT_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_AGENT_PASSWORD}
- tapOn: "Sign In"

- extendedWaitUntil:
    visible:
      id: "app-main-content"
    timeout: 60000
- extendedWaitUntil:
    visible: "Synced"
    timeout: 60000
- tapOn:
    id: "app-tab-LEADS"
- tapOn: "Add Lead"
- extendedWaitUntil:
    visible:
      id: "create-business-name"
    timeout: 30000
- tapOn:
    id: "create-business-name"
- inputText: "Legacy Maestro Online Sync ${MAESTRO_RUN_TAG} Gym"
- tapOn:
    id: "create-phone"
- inputText: "9${MAESTRO_RUN_TAG}020"
- tapOn:
    id: "create-locality"
- inputText: "Hazratganj"
- hideKeyboard
- tapOn:
    id: "save-create-lead-button"
- assertNotVisible:
    id: "create-lead-form"
- extendedWaitUntil:
    visible: ".*Legacy Maestro Online Sync ${MAESTRO_RUN_TAG} Gym.*"
    timeout: 60000
- tapOn:
    id: "app-tab-DASHBOARD"
- extendedWaitUntil:
    visible: "Synced"
    timeout: 60000
