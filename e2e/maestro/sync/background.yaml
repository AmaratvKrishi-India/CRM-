# Background Sync Flow
# Creates local work, backgrounds the exact app with a supported HOME key, and restores it.

appId: "com.amaratvkrishi.salescrm"

---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 120000
- tapOn:
    id: "login-email"
- inputText: ${MAESTRO_AGENT_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_AGENT_PASSWORD}
- tapOn: "Sign In"

- extendedWaitUntil:
    visible:
      id: "app-main-content"
    timeout: 60000
- tapOn:
    id: "app-tab-LEADS"
- tapOn: "Add Lead"
- extendedWaitUntil:
    visible:
      id: "create-business-name"
    timeout: 30000
- tapOn:
    id: "create-business-name"
- inputText: "Legacy Maestro Background ${MAESTRO_RUN_TAG} Gym A"
- tapOn:
    id: "create-phone"
- inputText: "9${MAESTRO_RUN_TAG}024"
- tapOn:
    id: "create-locality"
- inputText: "Aliganj"
- hideKeyboard
- tapOn:
    id: "save-create-lead-button"
- assertNotVisible:
    id: "create-lead-form"
- extendedWaitUntil:
    visible: ".*Legacy Maestro Background ${MAESTRO_RUN_TAG} Gym A.*"
    timeout: 60000
- tapOn: "Add Lead"
- extendedWaitUntil:
    visible:
      id: "create-business-name"
    timeout: 30000
- tapOn:
    id: "create-business-name"
- inputText: "Legacy Maestro Background ${MAESTRO_RUN_TAG} Gym B"
- tapOn:
    id: "create-phone"
- inputText: "9${MAESTRO_RUN_TAG}025"
- tapOn:
    id: "create-locality"
- inputText: "Aliganj"
- hideKeyboard
- tapOn:
    id: "save-create-lead-button"
- assertNotVisible:
    id: "create-lead-form"
- extendedWaitUntil:
    visible: ".*Legacy Maestro Background ${MAESTRO_RUN_TAG} Gym B.*"
    timeout: 60000
- tapOn:
    id: "app-tab-DASHBOARD"
- extendedWaitUntil:
    visible: "Synced"
    timeout: 60000

- pressKey: HOME
- waitForAnimationToEnd
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "app-main-content"
    timeout: 60000
- assertVisible: "Synced"
- tapOn:
    id: "app-tab-LEADS"
- extendedWaitUntil:
    visible: ".*Legacy Maestro Background ${MAESTRO_RUN_TAG} Gym A.*"
    timeout: 60000
- assertVisible: ".*Legacy Maestro Background ${MAESTRO_RUN_TAG} Gym B.*"
