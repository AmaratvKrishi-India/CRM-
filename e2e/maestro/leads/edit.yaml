# Edit Lead Flow - Agent Edits Existing Lead
# Tests the lead editing flow for AGENT role

appId: "com.amaratvkrishi.salescrm"

---
- launchApp:
    clearState: true

- waitFor:
    id: "login-screen"
    timeout: 15000

- tapOn: "email-input"
- inputText: "agent@test.com"
- tapOn: "password-input"
- inputText: "testpassword"
- tapOn: "login-button"

- waitFor:
    id: "agent-dashboard"
    timeout: 10000

- tapOn:
    id: "leads-tab"

- waitFor:
    id: "leads-list"

- tapOn:
    id: "lead-item-0"

- waitFor:
    id: "lead-detail"
    timeout: 3000

- tapOn:
    id: "edit-lead-button"

- waitFor:
    id: "edit-lead-form"
    timeout: 5000

- tapOn:
    id: "lead-name-input"
- inputText: "Updated Gym Name"

- tapOn:
    id: "lead-status-dropdown"
- tapOn:
    text: "CONTACTED"

- tapOn:
    id: "submit-lead-button"

- waitFor:
    id: "lead-detail"
    timeout: 3000

- assertVisible:
    text: "Updated Gym Name"

- assertVisible:
    text: "CONTACTED"