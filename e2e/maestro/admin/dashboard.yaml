# Admin Dashboard Flow
# Tests admin dashboard with org-wide metrics

appId: "com.amaratvkrishi.salescrm"

---
- launchApp:
    clearState: true

- waitFor:
    id: "login-screen"

- tapOn: "email-input"
- inputText: "admin@test.com"
- tapOn: "password-input"
- inputText: "testpassword"
- tapOn: "login-button"

- waitFor:
    id: "admin-dashboard"
    timeout: 10000

- # Verify admin tabs visible
- assertVisible:
    id: "admin-tab"
- assertVisible:
    id: "leads-tab"
- assertVisible:
    id: "agents-tab"
- assertVisible:
    id: "analytics-tab"
- assertVisible:
    id: "import-tab"

- # Verify KPI cards
- assertVisible:
    id: "total-leads-card"
- assertVisible:
    id: "active-agents-card"
- assertVisible:
    id: "calls-today-card"
- assertVisible:
    id: "conversion-rate-card"

- # Verify activity feed
- assertVisible:
    id: "activity-feed"

- # Navigate to leads tab
- tapOn:
    id: "leads-tab"
- waitFor:
    id: "admin-leads-list"
- assertVisible:
    id: "admin-leads-list"

- # Navigate to agents tab
- tapOn:
    id: "agents-tab"
- waitFor:
    id: "agents-list"
- assertVisible:
    id: "agents-list"

- # Navigate to analytics
- tapOn:
    id: "analytics-tab"
- waitFor:
    id: "analytics-charts"
- assertVisible:
    id: "analytics-charts"