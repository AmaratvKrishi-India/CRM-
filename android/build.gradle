// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Capacitor regenerates an empty flatDir repository for Cordova compatibility.
// Keep it only when there are actual local artifacts to resolve.
subprojects {
    afterEvaluate {
        repositories.findAll { repository ->
            repository instanceof org.gradle.api.artifacts.repositories.FlatDirectoryArtifactRepository &&
                repository.dirs.every { directory ->
                    fileTree(directory).matching { include '*.jar', '*.aar' }.isEmpty()
                }
        }.each { repositories.remove(it) }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
