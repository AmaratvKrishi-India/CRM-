# Session Persistence Flow
# Agent session survives a relaunch when local app state is retained.

appId: "com.amaratvkrishi.salescrm"

---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 120000
- tapOn:
    id: "login-email"
- inputText: ${MAESTRO_AGENT_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_AGENT_PASSWORD}
- tapOn: "Sign In"

- extendedWaitUntil:
    visible:
      id: "app-main-content"
    timeout: 60000
- assertVisible:
    id: "app-tab-DASHBOARD"

- launchApp:
    clearState: false

- extendedWaitUntil:
    visible:
      id: "app-main-content"
    timeout: 60000
- assertVisible:
    id: "app-tab-LEADS"
- assertNotVisible:
    id: "login-email"
