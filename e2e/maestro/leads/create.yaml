# Create Lead Flow - Agent Creates New Lead
# Tests the lead creation flow for AGENT role

appId: "com.amaratvkrishi.salescrm"

---
- launchApp:
    clearState: true

- waitFor:
    id: "login-screen"
    timeout: 15000

- tapOn: "email-input"
- inputText: "agent@test.com"
- tapOn: "password-input"
- inputText: "testpassword"
- tapOn: "login-button"

- waitFor:
    id: "agent-dashboard"
    timeout: 10000

- tapOn:
    id: "leads-tab"

- waitFor:
    id: "leads-list"

- tapOn:
    id: "add-lead-button"

- waitFor:
    id: "create-lead-form"
    timeout: 5000

- tapOn:
    id: "lead-name-input"
- inputText: "Test Gym Fitness Center"

- tapOn:
    id: "lead-phone-input"
- inputText: "9876543210"

- tapOn:
    id: "lead-email-input"
- inputText: "gym@testfitness.com"

- tapOn:
    id: "lead-source-dropdown"
- tapOn:
    text: "WALK_IN"

- tapOn:
    id: "submit-lead-button"

- waitFor:
    id: "leads-list"
    timeout: 5000

- assertVisible:
    text: "Test Gym Fitness Center"

- assertVisible:
    text: "9876543210"