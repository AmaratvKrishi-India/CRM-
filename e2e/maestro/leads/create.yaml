# Create Lead Flow - Agent Creates New Lead
# Uses the current local-first lead form and verifies the created record.

appId: "com.amaratvkrishi.salescrm"

---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 120000
- tapOn:
    id: "login-email"
- inputText: ${MAESTRO_AGENT_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_AGENT_PASSWORD}
- tapOn: "Sign In"

- extendedWaitUntil:
    visible:
      id: "app-main-content"
    timeout: 60000
- tapOn:
    id: "app-tab-LEADS"
- extendedWaitUntil:
    visible:
      text: ".*Gold Gym Hazratganj.*"
    timeout: 60000
- tapOn: "Add Lead"
- extendedWaitUntil:
    visible:
      id: "create-business-name"
    timeout: 60000
- tapOn:
    id: "create-business-name"
- inputText: "Legacy Maestro Create ${MAESTRO_RUN_TAG} Gym"
- tapOn:
    id: "create-phone"
- inputText: "9${MAESTRO_RUN_TAG}017"
- tapOn:
    id: "create-locality"
- inputText: "Hazratganj"
- hideKeyboard
- tapOn:
    id: "save-create-lead-button"
- assertNotVisible:
    id: "create-lead-form"

- extendedWaitUntil:
    visible:
      text: ".*Legacy Maestro Create ${MAESTRO_RUN_TAG} Gym.*"
    timeout: 60000
- tapOn: ".*Legacy Maestro Create ${MAESTRO_RUN_TAG} Gym.*"
- extendedWaitUntil:
    visible:
      id: "lead-detail"
    timeout: 60000
- assertVisible: ".*9${MAESTRO_RUN_TAG}017.*"
