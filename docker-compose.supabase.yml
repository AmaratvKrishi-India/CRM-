version: '3.8'

services:
  # Supabase Stack
  supabase-db:
    image: supabase/postgres:15.1.0.100
    container_name: supabase-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER for local Supabase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for local Supabase}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  supabase-auth:
    image: supabase/gotrue:v2.157.0
    container_name: supabase-auth
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB:-postgres}?search_path=auth
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: http://localhost:3000
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?Set SUPABASE_JWT_SECRET for local Supabase}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EMAIL_AUTOCONFIRM: "true"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "true"
    ports:
      - "9999:9999"
    depends_on:
      supabase-db:
        condition: service_healthy

  supabase-rest:
    image: supabase/postgrest:v12.2.0
    container_name: supabase-rest
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:?Set SUPABASE_JWT_SECRET for local Supabase}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    ports:
      - "3000:3000"
    depends_on:
      supabase-db:
        condition: service_healthy

  supabase-realtime:
    image: supabase/realtime:v2.34.0
    container_name: supabase-realtime
    environment:
      PORT: 4000
      DB_HOST: supabase-db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER for local Supabase}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for local Supabase}
      DB_NAME: ${POSTGRES_DB:-postgres}
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      SECRET_KEY_BASE: ${SUPABASE_JWT_SECRET:?Set SUPABASE_JWT_SECRET for local Supabase}
      ERL_AFLAGS: "-proto_dist inet_tcp"
    ports:
      - "4000:4000"
    depends_on:
      supabase-db:
        condition: service_healthy

  supabase-storage:
    image: supabase/storage-api:v1.10.0
    container_name: supabase-storage
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY:?Set SUPABASE_ANON_KEY for local Supabase}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY for local Supabase}
      POSTGREST_URL: http://supabase-rest:3000
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:?Set SUPABASE_JWT_SECRET for local Supabase}
      STORAGE_BACKEND: file
      FILE_SIZE_LIMIT: 52428800
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
    ports:
      - "5000:5000"
    depends_on:
      supabase-rest:
        condition: service_started

  supabase-meta:
    image: supabase/meta:v0.68.0
    container_name: supabase-meta
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: 5432
      PG_META_DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER for local Supabase}
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for local Supabase}
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
    ports:
      - "8080:8080"
    depends_on:
      supabase-db:
        condition: service_healthy

  supabase-kong:
    image: kong:3.4
    container_name: supabase-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    ports:
      - "8000:8000"
      - "8443:8443"
    volumes:
      - ./supabase/kong.yml:/var/lib/kong/kong.yml:ro
    depends_on:
      - supabase-auth
      - supabase-rest
      - supabase-realtime
      - supabase-storage

  supabase-studio:
    image: supabase/studio:20241202-1f8b8c8
    container_name: supabase-studio
    environment:
      STUDIO_PG_META_URL: http://supabase-meta:8080
      STUDIO_API_URL: http://supabase-kong:8000
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Set SUPABASE_ANON_KEY for local Supabase}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY for local Supabase}
    ports:
      - "54321:54321"
    depends_on:
      - supabase-kong

  supabase-edge-functions:
    image: supabase/edge-runtime:v1.64.4
    container_name: supabase-edge-functions
    environment:
      SUPABASE_EDGE_RUNTIME_PORT: 9000
      SUPABASE_EDGE_RUNTIME_WORKERS: 2
    ports:
      - "9000:9000"
    volumes:
      - ./supabase/functions:/home/deno/functions:ro
    depends_on:
      - supabase-kong

volumes:
  supabase-db-data:

networks:
  default:
    name: supabase-network
