# Agent Management Flow
# Provisions, edits, deactivates, and rejects a local-only test agent account.

appId: "com.amaratvkrishi.salescrm"

---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 120000
- tapOn:
    id: "login-email"
- inputText: ${MAESTRO_ADMIN_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_ADMIN_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit-button"

- extendedWaitUntil:
    visible:
      id: "admin-main-content"
    timeout: 60000
- tapOn:
    id: "admin-tab-agents"
- extendedWaitUntil:
    visible: "Sales Representatives"
    timeout: 60000
- tapOn: "Provision New Agent"
- extendedWaitUntil:
    visible: "Create New Sales Agent"
    timeout: 30000
- tapOn:
    id: "agent-name"
- inputText: "Legacy Maestro Agent"
- tapOn:
    id: "agent-email"
- inputText: ${MAESTRO_PROVISIONED_AGENT_EMAIL}
- tapOn:
    id: "agent-phone"
- inputText: "9${MAESTRO_RUN_TAG}018"
- tapOn:
    id: "agent-password"
- inputText: ${MAESTRO_PROVISIONED_AGENT_PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "agent-confirm-password"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "agent-confirm-password"
- inputText: ${MAESTRO_PROVISIONED_AGENT_PASSWORD}
- hideKeyboard
- tapOn: "Create Agent"
- extendedWaitUntil:
    notVisible:
      id: "agent-name"
    timeout: 120000
- extendedWaitUntil:
    visible:
      text: ".*Legacy Maestro Agent.*"
    timeout: 120000
- assertVisible: "ACTIVE"
- assertVisible: ${MAESTRO_PROVISIONED_AGENT_EMAIL}
- tapOn:
    id: "admin-agents-search"
- inputText: ${MAESTRO_PROVISIONED_AGENT_EMAIL}
- hideKeyboard
- tapOn:
    id: "agent-edit-${MAESTRO_PROVISIONED_AGENT_EMAIL}"
- extendedWaitUntil:
    visible:
      id: "edit-agent-phone"
    timeout: 30000
- tapOn:
    id: "edit-agent-phone"
- eraseText: 30
- inputText: "9${MAESTRO_RUN_TAG}019"
- hideKeyboard
- tapOn: "Save Changes"
- extendedWaitUntil:
    visible:
      text: ".*Legacy Maestro Agent.*"
    timeout: 60000
- assertVisible: "9${MAESTRO_RUN_TAG}019"
- tapOn:
    id: "agent-deactivate-${MAESTRO_PROVISIONED_AGENT_EMAIL}"
- extendedWaitUntil:
    visible: "Deactivate Agent"
    timeout: 30000
- tapOn: "Deactivate Account"
- extendedWaitUntil:
    visible:
      text: ".*Legacy Maestro Agent.*"
    timeout: 60000
- assertVisible: "INACTIVE"

# The next session check must reject the deactivated local account.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 60000
- tapOn:
    id: "login-email"
- inputText: ${MAESTRO_PROVISIONED_AGENT_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_PROVISIONED_AGENT_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit-button"
- extendedWaitUntil:
    visible: ".*Your account is inactive.*"
    timeout: 60000
- assertVisible: ".*Your account is inactive.*"
