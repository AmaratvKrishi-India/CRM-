# Offline Sync Flow - Agent Works Offline Then Syncs
# Uses Maestro's supported airplane-mode command; no shell or production network is involved.

appId: "com.amaratvkrishi.salescrm"

---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 120000
- tapOn:
    id: "login-email"
- inputText: ${MAESTRO_AGENT_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_AGENT_PASSWORD}
- tapOn: "Sign In"

- extendedWaitUntil:
    visible:
      id: "app-main-content"
    timeout: 60000
- tapOn:
    id: "app-tab-LEADS"
- tapOn: "Add Lead"
- extendedWaitUntil:
    visible:
      id: "create-business-name"
    timeout: 30000
- tapOn:
    id: "create-business-name"
- inputText: "Legacy Maestro Online Queue ${MAESTRO_RUN_TAG} Gym"
- tapOn:
    id: "create-phone"
- inputText: "9${MAESTRO_RUN_TAG}021"
- tapOn:
    id: "create-locality"
- inputText: "Alambagh"
- hideKeyboard
- tapOn:
    id: "save-create-lead-button"
- assertNotVisible:
    id: "create-lead-form"
- extendedWaitUntil:
    visible: ".*Legacy Maestro Online Queue ${MAESTRO_RUN_TAG} Gym.*"
    timeout: 60000

- setAirplaneMode: enabled
- tapOn:
    id: "app-tab-DASHBOARD"
- tapOn:
    id: "app-tab-LEADS"
- tapOn: "Add Lead"
- extendedWaitUntil:
    visible:
      id: "create-business-name"
    timeout: 30000
- tapOn:
    id: "create-business-name"
- inputText: "Legacy Maestro Offline Queue ${MAESTRO_RUN_TAG} Gym"
- tapOn:
    id: "create-phone"
- inputText: "9${MAESTRO_RUN_TAG}022"
- tapOn:
    id: "create-locality"
- inputText: "Alambagh"
- hideKeyboard
- tapOn:
    id: "save-create-lead-button"
- assertNotVisible:
    id: "create-lead-form"
- extendedWaitUntil:
    visible: ".*Legacy Maestro Offline Queue ${MAESTRO_RUN_TAG} Gym.*"
    timeout: 60000

- tapOn:
    id: "app-tab-DASHBOARD"
- setAirplaneMode: disabled
- launchApp:
    clearState: false
- tapOn: "Sync Now"
- extendedWaitUntil:
    visible: "Synced"
    timeout: 120000
- tapOn:
    id: "app-tab-LEADS"
- assertVisible: ".*Legacy Maestro Online Queue ${MAESTRO_RUN_TAG} Gym.*"
- assertVisible: ".*Legacy Maestro Offline Queue ${MAESTRO_RUN_TAG} Gym.*"
