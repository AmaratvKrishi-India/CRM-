# Admin Excel Import Flow
# Uses the bundled Lucknow dataset so no host file picker, production file, or shell command is involved.

appId: "com.amaratvkrishi.salescrm"

---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 120000
- tapOn:
    id: "login-email"
- inputText: ${MAESTRO_ADMIN_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_ADMIN_PASSWORD}
- tapOn: "Sign In"

- extendedWaitUntil:
    visible:
      id: "admin-main-content"
    timeout: 60000
- tapOn:
    id: "admin-tab-data"
- extendedWaitUntil:
    visible:
      id: "data-tab-IMPORTS"
    timeout: 60000
- tapOn:
    id: "data-tab-IMPORTS"
- tapOn: "Launch Importer"
- extendedWaitUntil:
    visible: "Excel Lead Importer"
    timeout: 60000
- tapOn: "Load 141 Leads"
- extendedWaitUntil:
    visible: ".*Column Field Mapping.*"
    timeout: 60000
- assertVisible: ".*Auto-detected.*"
- tapOn:
    id: "import-preview-search"
- inputText: "Fitness Point"
- hideKeyboard
- scrollUntilVisible:
    element: "Import 140 Valid Leads"
    direction: DOWN
    timeout: 120000
- tapOn: "Import 140 Valid Leads"
- extendedWaitUntil:
    visible: "Importing Leads into CRM..."
    timeout: 60000
- extendedWaitUntil:
    visible: "Import Completed!"
    timeout: 120000
- assertVisible: "Imported New"
- assertVisible: "Total Processed"
- tapOn: "View Leads in CRM"
- extendedWaitUntil:
    visible: "Batch Import History"
    timeout: 60000
