# Offline Sync Flow - Agent Works Offline Then Syncs
# Tests offline-first capability with deferred sync

appId: "com.amaratvkrishi.salescrm"

---
- launchApp:
    clearState: true

- waitFor:
    id: "login-screen"
    timeout: 15000

- tapOn: "email-input"
- inputText: "agent@test.com"
- tapOn: "password-input"
- inputText: "testpassword"
- tapOn: "login-button"

- waitFor:
    id: "agent-dashboard"
    timeout: 10000

- # Verify online initially
- assertVisible:
    id: "online-indicator"

- # Create lead while online
- tapOn:
    id: "leads-tab"

- tapOn:
    id: "add-lead-button"

- waitFor:
    id: "create-lead-form"

- tapOn:
    id: "lead-name-input"
- inputText: "Online Lead"

- tapOn:
    id: "lead-phone-input"
- inputText: "9876543210"

- tapOn:
    id: "submit-lead-button"

- waitFor:
    id: "leads-list"

- # Simulate offline (airplane mode or network disconnect)
- # Note: In Maestro, we can't directly control network, so we verify the offline indicator appears
- # when the app detects offline state

- # Create another lead (should queue locally)
- tapOn:
    id: "add-lead-button"

- waitFor:
    id: "create-lead-form"

- tapOn:
    id: "lead-name-input"
- inputText: "Offline Lead"

- tapOn:
    id: "lead-phone-input"
- inputText: "9876543211"

- tapOn:
    id: "submit-lead-button"

- waitFor:
    id: "leads-list"

- # Verify lead appears in list (optimistic UI)
- assertVisible:
    text: "Offline Lead"

- # Check sync queue has pending items
- tapOn:
    id: "settings-tab"

- tapOn:
    id: "sync-settings"

- assertVisible:
    id: "pending-count"
    text: "1"

- # Simulate coming back online
- # App should auto-sync or show sync available

- # Force sync
- tapOn:
    id: "sync-button"

- waitFor:
    id: "sync-complete"
    timeout: 15000

- assertVisible:
    id: "sync-complete"

- # Verify both leads now synced
- assertVisible:
    id: "pending-count"
    text: "0"