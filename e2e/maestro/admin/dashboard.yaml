# Admin Dashboard Flow
# Verifies current organization-wide metrics and primary navigation.

appId: "com.amaratvkrishi.salescrm"

---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 120000
- tapOn:
    id: "login-email"
- inputText: ${MAESTRO_ADMIN_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_ADMIN_PASSWORD}
- tapOn: "Sign In"

- extendedWaitUntil:
    visible:
      id: "admin-main-content"
    timeout: 60000
- assertVisible:
    id: "admin-tab-home"
- assertVisible: "Executive Overview"
- assertVisible: ".*TOTAL LEADS.*"
- assertVisible: ".*TOTAL CALLS.*"
- assertVisible: ".*VERIFIED TALK TIME.*"
- assertVisible: ".*FOLLOW-UPS.*"

- tapOn:
    id: "admin-tab-leads"
- extendedWaitUntil:
    visible:
      text: ".*Iron Paradise Alambagh.*"
    timeout: 60000
- tapOn:
    id: "admin-tab-agents"
- extendedWaitUntil:
    visible: "Sales Representatives"
    timeout: 60000
- tapOn:
    id: "admin-tab-data"
- extendedWaitUntil:
    visible:
      id: "data-tab-DATABASE"
    timeout: 60000
- tapOn:
    id: "admin-tab-reports"
- extendedWaitUntil:
    visible: "Analytics & Reporting"
    timeout: 60000
- assertVisible: "Territory Reports"
