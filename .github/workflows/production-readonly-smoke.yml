name: Production access and read-only smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - scripts/production-readonly-smoke.mjs
      - .github/workflows/production-readonly-smoke.yml

permissions:
  contents: read

concurrency:
  group: production-readonly-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-login:
    name: Check Production access, then login and assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without unused Cypress binary
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: npm ci --no-fund --no-audit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Inspect public login without credentials or backend requests
        run: node scripts/production-readonly-smoke.mjs
      - name: Retain redacted outcome only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-readonly-smoke
          path: test-results/production-readonly-smoke.json
          if-no-files-found: error
          retention-days: 7
