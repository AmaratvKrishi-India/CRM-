# Current UI contract: agent edits the designated test lead created by the preceding flow.
appId: "com.amaratvkrishi.salescrm"

---
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible:
      id: "app-main-content"
    timeout: 30000
- tapOn:
    id: "app-tab-LEADS"
- extendedWaitUntil:
    visible:
      text: ".*Maestro Smoke Gym.*"
    timeout: 30000
- tapOn:
    text: ".*Maestro Smoke Gym.*"
- extendedWaitUntil:
    visible:
      id: "lead-detail"
    timeout: 30000
- tapOn:
    id: "edit-lead-button"
- extendedWaitUntil:
    visible:
      id: "edit-status"
    timeout: 30000
- tapOn:
    id: "edit-phone"
    point: "95%,50%"
- eraseText: 30
- inputText: "9000000001"
- hideKeyboard
- tapOn:
    id: "save-edit-lead-button"

- extendedWaitUntil:
    visible:
      id: "lead-detail"
    timeout: 30000
- assertVisible: ".*9000000001.*"
