# Logout Flow
# Admin session is created inside this flow so it is independently runnable.

appId: "com.amaratvkrishi.salescrm"

---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 120000
- tapOn:
    id: "login-email"
- inputText: ${MAESTRO_ADMIN_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_ADMIN_PASSWORD}
- tapOn: "Sign In"

- extendedWaitUntil:
    visible:
      id: "admin-main-content"
    timeout: 60000
- tapOn:
    id: "admin-sign-out-button"

- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 60000
- assertVisible:
    id: "login-password"
- assertNotVisible:
    id: "admin-main-content"
