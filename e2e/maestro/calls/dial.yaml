# Dial Call Flow - Agent Makes Outbound Call
# ACTION_DIAL opens the Android dialer; returning to the CRM exposes the outcome form.

appId: "com.amaratvkrishi.salescrm"

---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 120000
- tapOn:
    id: "login-email"
- inputText: ${MAESTRO_AGENT_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_AGENT_PASSWORD}
- tapOn: "Sign In"

- extendedWaitUntil:
    visible:
      id: "app-main-content"
    timeout: 60000
- tapOn:
    id: "app-tab-LEADS"
- tapOn:
    id: "leads-search"
- inputText: "Gold Gym Hazratganj"
- hideKeyboard
- extendedWaitUntil:
    visible:
      text: ".*Gold Gym Hazratganj.*"
    timeout: 60000
- tapOn: ".*Gold Gym Hazratganj.*Gym.*"
- extendedWaitUntil:
    visible:
      id: "lead-detail"
    timeout: 60000
- tapOn:
    id: "call-button"

# Return from the native ACTION_DIAL screen to the CRM outcome form.
- pressKey: HOME
- launchApp:
    clearState: false
- tapOn:
    id: "app-tab-LEADS"
- tapOn:
    id: "leads-search"
- inputText: "Gold Gym Hazratganj"
- hideKeyboard
- extendedWaitUntil:
    visible: ".*Gold Gym Hazratganj.*"
    timeout: 60000
- tapOn: ".*Gold Gym Hazratganj.*Gym.*"
- extendedWaitUntil:
    visible:
      id: "lead-detail"
    timeout: 60000
- tapOn: ".*Log call outcome.*"
- extendedWaitUntil:
    visible: ".*Unverified.*ACTION_DIAL.*"
    timeout: 60000
- assertVisible: "Unverified (ACTION_DIAL)"
- assertVisible:
    id: "reported-minutes"
- tapOn: "Skip / do not record"
