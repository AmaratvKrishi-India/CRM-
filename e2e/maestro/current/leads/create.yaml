# Current UI contract: an authenticated agent creates the designated test lead through the real form.
appId: "com.amaratvkrishi.salescrm"

---
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible:
      id: "app-main-content"
    timeout: 30000
- tapOn:
    id: "app-tab-LEADS"
- tapOn:
    id: "add-lead-button"
- extendedWaitUntil:
    visible:
      id: "create-business-name"
    timeout: 30000

- tapOn:
    id: "create-business-name"
- inputText: "Maestro Smoke Gym"
- tapOn:
    id: "create-phone"
- inputText: "9000000001"
- tapOn:
    id: "create-locality"
- inputText: "Hazratganj"
- tapOn:
    id: "save-create-lead-button"

- extendedWaitUntil:
    visible:
      text: ".*Maestro Smoke Gym.*"
    timeout: 30000
- assertVisible:
    text: ".*Maestro Smoke Gym.*"
- assertVisible:
    text: ".*9000000001.*"
