# Leads List - View and Navigate
# Agent can search/open a seeded lead and return to the list.

appId: "com.amaratvkrishi.salescrm"

---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 120000
- tapOn:
    id: "login-email"
- inputText: ${MAESTRO_AGENT_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_AGENT_PASSWORD}
- tapOn: "Sign In"

- extendedWaitUntil:
    visible:
      id: "app-main-content"
    timeout: 60000
- tapOn:
    id: "app-tab-LEADS"
- tapOn:
    id: "leads-search"
- inputText: "Gold Gym Hazratganj"
- hideKeyboard
- extendedWaitUntil:
    visible:
      text: ".*Gold Gym Hazratganj.*"
    timeout: 60000
- tapOn:
    id: "lead-item-.*"

- extendedWaitUntil:
    visible:
      id: "lead-detail"
    timeout: 60000
- assertVisible:
    text: ".*Gold Gym Hazratganj.*"
- assertVisible: ".*\\+919876543210.*"
- tapOn:
    id: "back-button"
- extendedWaitUntil:
    visible:
      text: ".*Gold Gym Hazratganj.*"
    timeout: 60000
