# Call Outcome Flow - Agent Logs Call Result
# Records a current ACTION_DIAL outcome and a sales remark.

appId: "com.amaratvkrishi.salescrm"

---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 120000
- tapOn:
    id: "login-email"
- inputText: ${MAESTRO_AGENT_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_AGENT_PASSWORD}
- tapOn: "Sign In"

- extendedWaitUntil:
    visible:
      id: "app-main-content"
    timeout: 60000
- tapOn:
    id: "app-tab-LEADS"
- tapOn:
    id: "leads-search"
- inputText: "Gold Gym Hazratganj"
- hideKeyboard
- extendedWaitUntil:
    visible:
      text: ".*Gold Gym Hazratganj.*"
    timeout: 60000
- tapOn: ".*Gold Gym Hazratganj.*Gym.*"
- extendedWaitUntil:
    visible:
      id: "lead-detail"
    timeout: 60000
- tapOn:
    id: "call-button"
- pressKey: HOME
- launchApp:
    clearState: false
- tapOn:
    id: "app-tab-LEADS"
- tapOn:
    id: "leads-search"
- inputText: "Gold Gym Hazratganj"
- hideKeyboard
- extendedWaitUntil:
    visible: ".*Gold Gym Hazratganj.*"
    timeout: 60000
- tapOn: ".*Gold Gym Hazratganj.*Gym.*"
- extendedWaitUntil:
    visible:
      id: "lead-detail"
    timeout: 60000
- tapOn: ".*Log call outcome.*"
- extendedWaitUntil:
    visible: ".*Unverified.*ACTION_DIAL.*"
    timeout: 60000
- tapOn: "Connected"
- tapOn: "Interested"
- scrollUntilVisible:
    element: ".*Save call outcome.*"
    direction: DOWN
    timeout: 10000
- tapOn: ".*Save call outcome.*"

- extendedWaitUntil:
    visible:
      id: "lead-detail"
    timeout: 60000
- assertVisible: "Interested"
- tapOn: "Calls (.*)"
- assertVisible: "Connected"
