# Edit Lead Flow - Agent Edits Existing Lead
# Changes the seeded lead's pipeline status through the current edit form.

appId: "com.amaratvkrishi.salescrm"

---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 120000
- tapOn:
    id: "login-email"
- inputText: ${MAESTRO_AGENT_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_AGENT_PASSWORD}
- tapOn: "Sign In"

- extendedWaitUntil:
    visible:
      id: "app-main-content"
    timeout: 60000
- tapOn:
    id: "app-tab-LEADS"
- extendedWaitUntil:
    visible:
      text: ".*Gold Gym Hazratganj.*"
    timeout: 60000
- tapOn:
    id: "leads-search"
- inputText: "Gold Gym Hazratganj"
- hideKeyboard
- tapOn: ".*Gold Gym Hazratganj.*Gym.*"
- extendedWaitUntil:
    visible:
      id: "lead-detail"
    timeout: 60000
- tapOn:
    id: "edit-lead-button"
- extendedWaitUntil:
    visible:
      id: "edit-status"
    timeout: 60000
- tapOn:
    id: "edit-status"
- scrollUntilVisible:
    element: "Contacted"
    direction: UP
    timeout: 30000
- tapOn: "Contacted"
- tapOn:
    id: "save-edit-lead-button"

- extendedWaitUntil:
    visible:
      id: "lead-detail"
    timeout: 60000
- assertVisible: "Contacted"
